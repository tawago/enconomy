[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
evm_version = "osaka"
optimizer = true
optimizer_runs = 200
via_ir = true
# bb-generated UltraHonk verifiers (test fixtures): built like the ZK lane builds them
additional_compiler_profiles = [{ name = "honk", via_ir = false, optimizer_runs = 1 }]
compilation_restrictions = [{ paths = "test/fixtures/zk/*.sol", via_ir = false, max_optimizer_runs = 1 }]
fs_permissions = [{ access = "read-write", path = "./deployments" }, { access = "read", path = "./test/fixtures" }, { access = "read", path = "./out" }]

[rpc_endpoints]
sepolia = "https://ethereum-sepolia-rpc.publicnode.com"

[lint]
lint_on_build = false
