[profile.default]
src = "src"
test = "test"
out = "out"
libs = []
solc_version = "0.8.30"
# 0x100 (P256VERIFY) exists in revm from Osaka. The body frame calls it.
evm_version = "osaka"
optimizer = true
optimizer_runs = 1000000
via_ir = true
fs_permissions = [{ access = "read", path = "../ctx-vector.json" }]
# test/LiveToken.t.sol reads the real Chrome tokens from the live harness.
remappings = ["live-chrome/=../../../research/ethglobal-mumbai/evp-recovery/live-chrome/"]
allow_paths = ["../../../research/ethglobal-mumbai/evp-recovery/live-chrome"]
