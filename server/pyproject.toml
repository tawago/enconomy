[project]
name = "pop-server"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "cryptography>=43",
    "numpy>=1.26",
    "python-multipart>=0.0.9",
    "cbor2>=5.6",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "scipy>=1.17.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore:Using .httpx. with .starlette.testclient."]
