[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["../../poc-evp-issuer/lib"]
remappings = ["forge-std/=../../poc-evp-issuer/lib/forge-std/src/"]
solc_version = "0.8.30"
evm_version = "osaka"
optimizer = true
optimizer_runs = 1000000
via_ir = true
fs_permissions = [{ access = "read", path = "./test" }, { access = "read", path = "./build" }]
code_size_limit = 200000

[profile.legacy]
src = "src"
test = "test"
out = "out-legacy"
libs = ["../../poc-evp-issuer/lib"]
remappings = ["forge-std/=../../poc-evp-issuer/lib/forge-std/src/"]
solc_version = "0.8.30"
evm_version = "osaka"
optimizer = true
optimizer_runs = 200
via_ir = false
fs_permissions = [{ access = "read", path = "./test" }, { access = "read", path = "./build" }]
code_size_limit = 200000
