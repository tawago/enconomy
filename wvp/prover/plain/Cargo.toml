# Plain-ABI wrapper over the pinned repo's ecdsa-spartan2.
# Same logic as openac-sdk/wasm/src/lib.rs, without wasm-bindgen, because the
# wasm-bindgen CLI could not be installed where this was first built. See ../README.md.
[package]
name = "openac-plain"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
ecdsa-spartan2 = { path = "../zkID/wallet-unit-poc/ecdsa-spartan2", default-features = false }
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3.3"
ff = { version = "0.13.0", features = ["derive"] }
spartan2 = { git = "https://github.com/0xVikasRushi/Spartan2.git", branch = "openac-sdk", default-features = false }
rand = "0.8"

[profile.release]
opt-level = "s"
lto = true

[workspace]

[patch.crates-io]
getrandom = { path = "../shims/getrandom" }
web-time = { path = "../shims/web-time" }
