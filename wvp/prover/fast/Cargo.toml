# Fast wrapper. The plain-ABI wrapper in ../plain plus: decoded keys kept in memory, step timings, and a rayon pool
# when built with wasm atomics. Prover crates and their pins are the same as ../plain. See ../README.md.
[package]
name = "openac-plain2"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
ecdsa-spartan2 = { path = "../zkID/wallet-unit-poc/ecdsa-spartan2", default-features = false }
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3.3"
ff = { version = "0.13.0", features = ["derive"] }
spartan2 = { git = "https://github.com/0xVikasRushi/Spartan2.git", branch = "openac-sdk", default-features = false }
rand = "0.8"
rayon = "1.10.0"

[profile.release]
opt-level = 3
lto = true

[workspace]

[patch.crates-io]
getrandom = { path = "../shims/getrandom" }
web-time = { path = "../shims/web-time" }
