# fv/v1/server against the server/ in this commit: rechecks, walk, fresh traces, Lean build and mutants, replay.
# Runs when the server core or the fv work changes, so a behaviour change in server/pop that the model doesn't
# match fails here instead of going stale in a doc. Run output is uploaded as an artifact, never committed.
name: fv-server

on:
  push:
    branches: [main]
    paths: ["server/pop/**", "server/pyproject.toml", "server/uv.lock", "fv/v1/server/**", "fv/v1/zkp/popfv/**", ".github/workflows/fv-server.yml"]
  pull_request:
    paths: ["server/pop/**", "server/pyproject.toml", "server/uv.lock", "fv/v1/server/**", "fv/v1/zkp/popfv/**", ".github/workflows/fv-server.yml"]
  workflow_dispatch:

jobs:
  fv:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Python deps
        working-directory: server
        run: uv sync --group dev --python 3.12
      - name: Lean toolchain
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: |
            fv/v1/server/lean/.lake
            fv/v1/zkp/popfv/.lake
          key: lake-${{ hashFiles('fv/v1/server/lean/lake-manifest.json', 'fv/v1/server/lean/lean-toolchain', 'fv/v1/zkp/popfv/lake-manifest.json') }}
      - name: run_all.sh
        env:
          PY: ${{ github.workspace }}/server/.venv/bin/python
        run: fv/v1/server/run_all.sh all
      - name: Upload run output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fv-server-run
          path: |
            fv/v1/server/logs/*.txt
          retention-days: 30
