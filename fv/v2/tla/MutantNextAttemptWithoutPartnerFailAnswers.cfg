\* Mutant M4, no timeout: must fail AnswersHeld (the SEED_HASH for 1 answers no partner FAIL for 0).
SPECIFICATION SafetySpec
CONSTANTS
    Vals = {0, 1, 2}
    AllowTimeout = FALSE
    AllowClose = FALSE
    AllowSessionEnd = FALSE
    AllowLocalFail = TRUE
    AllowLateLocalFail = FALSE
    AllowTimeFail = TRUE
    Mutant = "nextAttemptWithoutPartnerFail"
INVARIANTS AnswersHeld
