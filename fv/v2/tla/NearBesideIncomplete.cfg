\* Reach check: must fail, near on one device and incomplete on the other after the link closed.
SPECIFICATION SafetySpec
CONSTANTS
    Vals = {0, 1, 2}
    AllowTimeout = TRUE
    AllowClose = TRUE
    AllowSessionEnd = TRUE
    AllowLocalFail = TRUE
    AllowLateLocalFail = TRUE
    AllowTimeFail = TRUE
    Mutant = "none"
INVARIANTS NoNearBesideIncomplete
