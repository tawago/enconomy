\* Reach check: must fail, both devices can reach near on attempt 1.
SPECIFICATION SafetySpec
CONSTANTS
    Vals = {0, 1, 2}
    AllowTimeout = FALSE
    AllowClose = FALSE
    AllowSessionEnd = FALSE
    AllowLocalFail = TRUE
    AllowLateLocalFail = FALSE
    AllowTimeFail = TRUE
    Mutant = "none"
INVARIANTS NoNearAfterRetry
