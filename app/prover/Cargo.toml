[package]
name = "pop-prover"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "pop_prover"
# staticlib (iOS) / cdylib (Android) are picked per target by scripts/build_*.sh via `cargo rustc --crate-type`.
crate-type = ["rlib"]

[[bin]]
name = "popprover"
path = "src/bin/popprover.rs"

# Same pins as research/sound-bound/spikes/zk/optionA-v2/prover (zkID b395e09c). circom-scotia is not
# needed: the proving key carries the R1CS shape, so the phone never loads the 400 MB .r1cs.
[dependencies]
spartan2 = { git = "https://github.com/0xVikasRushi/Spartan2.git", rev = "d687dbb639eccbdd21e62fecec97c5826bc4dbbf", default-features = false }
witnesscalc-adapter = { git = "https://github.com/zkmopro/witnesscalc_adapter.git", rev = "e5a82bcb7d54a4694fc0662c51b01d99134e686c" }
bellpepper-core = "0.4.0"
ff = { version = "0.13.0", features = ["derive"] }
serde = "1"
serde_json = "1.0.140"
bincode = "1.3.3"
memmap2 = "0.9.8"
num-bigint = "0.4.6"
# pk ships zstd-compressed (470 MB -> 12 MB) and is decoded while loading
zstd = { version = "0.13", default-features = false }

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21", default-features = false }

[build-dependencies]
witnesscalc-adapter = { git = "https://github.com/zkmopro/witnesscalc_adapter.git", rev = "e5a82bcb7d54a4694fc0662c51b01d99134e686c" }

[profile.release]
debug = false
strip = "debuginfo"
