[package]
name = "zkprove"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[[bin]]
name = "zkprove"
path = "src/main.rs"

[features]
default = []
witness = ["dep:acvm", "dep:bn254_blackbox_solver", "dep:noirc_abi", "dep:noirc_artifacts"]

[dependencies]
# ffi backend links libbb-external.a from BB_LIB_DIR (see build_android.sh); same nightly as the team's bb CLI
barretenberg-rs = { version = "=5.0.0-nightly.20260522", default-features = false, features = ["ffi"] }
flate2 = "1"
serde_json = "1"
base64 = "0.22"
# ACVM witness generation, same noir as the team's nargo 1.0.0-beta.22 (c57152f9)
acvm = { git = "https://github.com/noir-lang/noir", tag = "v1.0.0-beta.22", optional = true }
bn254_blackbox_solver = { git = "https://github.com/noir-lang/noir", tag = "v1.0.0-beta.22", optional = true }
noirc_abi = { git = "https://github.com/noir-lang/noir", tag = "v1.0.0-beta.22", optional = true }
noirc_artifacts = { git = "https://github.com/noir-lang/noir", tag = "v1.0.0-beta.22", optional = true }

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21", default-features = false }

[build-dependencies]
cc = "1"

[profile.release]
debug = false
strip = "debuginfo"
