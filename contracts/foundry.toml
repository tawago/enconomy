[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
evm_version = "osaka"
optimizer = true
optimizer_runs = 200
via_ir = true
fs_permissions = [{ access = "read-write", path = "./deployments" }, { access = "read", path = "./test/fixtures" }]

[rpc_endpoints]
sepolia = "https://ethereum-sepolia-rpc.publicnode.com"

[lint]
lint_on_build = false
